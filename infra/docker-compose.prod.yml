# M12 / 09 §3 — Production Compose Spec
# Sized for 1 VPS: Caddy (TLS) + API + Workers (2 replicas) + Beat + Postgres(pgvector) + Redis

name: adera-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://adera:adera@db:5432/adera}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-Q", "io,cpu"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://adera:adera@db:5432/adera}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://adera:adera@db:5432/adera}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adera}
      POSTGRES_DB: ${POSTGRES_DB:-adera}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adera} -d ${POSTGRES_DB:-adera}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata_prod:
  redisdata_prod:
