name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Same image as local compose so "works on my machine" means something.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adera
          POSTGRES_PASSWORD: adera
          POSTGRES_DB: adera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adera -d adera"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENV: ci
      DATABASE_URL: postgresql+asyncpg://adera:adera@localhost:5432/adera
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff format --check app tests
          uv run ruff check app tests

      - name: Type-check
        run: uv run mypy app

      - name: Migrations apply from scratch
        # Catches the failure mode where models drift from migrations: the schema
        # a fresh deploy builds is the only one that matters.
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest tests

      - name: Contract drift check (ADR-025)
        # Client repos generate from contracts/openapi.json; a code change that
        # alters the API without regenerating the committed contract must fail.
        run: |
          make openapi
          git diff --exit-code contracts/

      # Week 2+: the eval harness gates everything after it (06 §9).
      # - name: AI evals (smoke)
      #   run: make eval-smoke
